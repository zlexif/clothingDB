name: Deploy production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://clothingdb.auradevelopment.xyz
    steps:
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set yet, skipping the deploy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.token.outputs.ok == 'true'
      - uses: oven-sh/setup-bun@v2
        if: steps.token.outputs.ok == 'true'
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        if: steps.token.outputs.ok == 'true'
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
        if: steps.token.outputs.ok == 'true'
      - run: bun run typecheck
        if: steps.token.outputs.ok == 'true'
      - run: bun run test
        if: steps.token.outputs.ok == 'true'
      - run: bun run deploy production
        if: steps.token.outputs.ok == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
