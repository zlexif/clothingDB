name: Preview

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Upload preview
        run: |
          set -o pipefail
          bun run deploy staging --preview pr-${{ github.event.pull_request.number }} | tee wrangler.log
          echo "url=$(grep -oE 'https://pr-[^ ]+\.workers\.dev' wrangler.log | head -1)" >> "$GITHUB_OUTPUT"
        id: upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment the preview link
        if: steps.upload.outputs.url != ''
        run: gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "Preview for this pull request: ${{ steps.upload.outputs.url }}"
        env:
          GH_TOKEN: ${{ github.token }}
