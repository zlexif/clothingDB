pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,tsx,json,css}"
      run: bunx biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - name: typos
      run: typos --force-exclude {staged_files}

commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}
